version: "3.9"

# =============================================================================
# CoinHub — Full Stack
#
# Infrastructure : postgres, redis, kafka, kafka-ui
# App services   : migrate, api, engine, worker,
#                  order-projection-consumer, notification-consumer
# Monitoring     : prometheus, grafana
#
# Usage:
#   docker compose build          # build the Go image
#   docker compose up -d          # start everything
#   docker compose up -d api      # start only the API
# =============================================================================

x-app-common: &app-common
  build:
    context: .
    dockerfile: Dockerfile
  env_file: .env.docker
  restart: unless-stopped
  networks:
    - coinhub_net
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    kafka:
      condition: service_healthy

services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: coinhub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: coinhub
      POSTGRES_PASSWORD: coinhub
      POSTGRES_DB: coinhub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - coinhub_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coinhub -d coinhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: coinhub_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - coinhub_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:latest
    container_name: coinhub_kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      # KRaft mode — no ZooKeeper needed
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: coinhub-kafka-cluster-001
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - coinhub_net
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: coinhub_kafka_ui
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: coinhub
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - coinhub_net
    depends_on:
      kafka:
        condition: service_healthy

  # ── App services ────────────────────────────────────────────────────────────

  migrate:
    <<: *app-common
    container_name: coinhub_migrate
    command: ["migrate"]
    restart: "no"   # run once and exit

  api:
    <<: *app-common
    container_name: coinhub_api
    command: ["api"]
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  engine:
    <<: *app-common
    container_name: coinhub_engine
    command: ["engine"]
    depends_on:
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app-common
    container_name: coinhub_worker
    command: ["worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  order-projection-consumer:
    <<: *app-common
    container_name: coinhub_order_projection
    command: ["order-projection-consumer"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  notification-consumer:
    <<: *app-common
    container_name: coinhub_notification
    command: ["notification-consumer"]
    depends_on:
      kafka:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ── Monitoring ──────────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:latest
    container_name: coinhub_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    networks:
      - coinhub_net

  grafana:
    image: grafana/grafana-oss:latest
    container_name: coinhub_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=coinhub
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - coinhub_net
    depends_on:
      - prometheus

networks:
  coinhub_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  prometheus_data:
  grafana_data:
