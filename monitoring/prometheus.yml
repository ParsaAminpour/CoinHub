global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # When running fully in Docker (docker compose up), use the service name.
  # When running the app locally (air/go run) with only monitoring in Docker,
  # change the target to "host.docker.internal:8083".
  - job_name: "coinhub_api"
    static_configs:
      - targets: ["coinhub_api:8083"]
    metrics_path: /metrics

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
